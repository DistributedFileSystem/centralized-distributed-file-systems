name: dfs-node
# Multi-laptop LAN cluster compose file (local build on each laptop).
# Usage:
#   Laptop 1 (Metadata + Data): docker compose -f deploy/node.yml --env-file deploy/env/laptop1.env up --build
#   Laptop 2..5 (Data only):    docker compose -f deploy/node.yml --env-file deploy/env/laptopN.env up --build

services:
  metadata:
    profiles: ["metadata"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${METADATA_LISTEN_PORT:-7000}:${METADATA_LISTEN_PORT:-7000}"
    volumes:
      - metadata-data:/data
    environment:
      NODE_ROLE: metadata
      NODE_ID: ${METADATA_NODE_ID:-m1}
      LISTEN_PORT: "${METADATA_LISTEN_PORT:-7000}"
      ADVERTISE_HOST: ${ADVERTISE_HOST:?ADVERTISE_HOST must be set to this laptop LAN IP}
      METADATA_ENDPOINTS: ${METADATA_ENDPOINTS:?METADATA_ENDPOINTS must be set}
      DATA_DIR: /data
      TOKEN_KEY: ${TOKEN_KEY:?TOKEN_KEY must be set}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      KEEP_VERSIONS: ${KEEP_VERSIONS:-5}
      SNAPSHOT_INTERVAL_OPS: ${SNAPSHOT_INTERVAL_OPS:-100}
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c "</dev/tcp/127.0.0.1/$${LISTEN_PORT:-7000}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  data:
    profiles: ["data"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${DATA_LISTEN_PORT:-7001}:${DATA_LISTEN_PORT:-7001}"
    volumes:
      - data-data:/data
    environment:
      NODE_ROLE: data
      NODE_ID: ${DATA_NODE_ID:-ds-1}
      LISTEN_PORT: "${DATA_LISTEN_PORT:-7001}"
      ADVERTISE_HOST: ${ADVERTISE_HOST:?ADVERTISE_HOST must be set to this laptop LAN IP}
      METADATA_ENDPOINTS: ${METADATA_ENDPOINTS:?METADATA_ENDPOINTS must be set}
      DATA_DIR: /data
      TOKEN_KEY: ${TOKEN_KEY:?TOKEN_KEY must be set}
      CAPACITY_BYTES: ${CAPACITY_BYTES:-0}
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c "</dev/tcp/127.0.0.1/$${LISTEN_PORT:-7001}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  metadata-data:
  data-data:
