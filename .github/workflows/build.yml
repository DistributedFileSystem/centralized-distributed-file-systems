name: build

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Dfs.sln
      - run: dotnet build Dfs.sln --no-restore -c Release
      - run: dotnet test tests/Dfs.Tests/Dfs.Tests.csproj --no-build -c Release
      - name: Run deploy verification tests
        run: python3 -m unittest discover -s tests/deploy -p 'test_*.py' -v

  acceptance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore and build acceptance tests
        run: |
          dotnet restore tests/Dfs.AcceptanceTests/Dfs.AcceptanceTests.csproj
          dotnet build tests/Dfs.AcceptanceTests/Dfs.AcceptanceTests.csproj --no-restore -c Release
      - name: Start Compose cluster
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/env/local.example.env up -d --build
      - name: Wait for cluster readiness
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          while true; do
            status=$(docker inspect --format '{{.State.Status}}' dfs-metadata 2>/dev/null || echo "missing")
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' dfs-metadata 2>/dev/null || echo "none")
            if [ "$status" = "running" ] && [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ] || [ "$health" = "unhealthy" ]; then
              echo "dfs-metadata failed to become healthy (status=$status, health=$health)" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for dfs-metadata to become healthy (status=$status, health=$health)" >&2
              exit 1
            fi
            sleep 2
          done

          tcp_ok=0
          for attempt in 1 2 3 4 5; do
            if timeout 5 bash -c '</dev/tcp/127.0.0.1/7000'; then
              tcp_ok=1
              break
            fi
            sleep 1
          done
          if [ "$tcp_ok" != "1" ]; then
            echo "TCP port 127.0.0.1:7000 did not accept connections" >&2
            exit 1
          fi

          for idx in 1 2 3 4 5; do
            container="dfs-data-${idx}"
            state=$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || echo "missing")
            exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container" 2>/dev/null || echo "1")
            case "$state" in
              running)
                ;;
              exited)
                if [ "$exit_code" != "0" ]; then
                  echo "$container exited with non-zero code: $exit_code" >&2
                  exit 1
                fi
                ;;
              *)
                echo "Unexpected state for $container: $state (exit_code=$exit_code)" >&2
                exit 1
                ;;
            esac
          done
      - name: Run acceptance tests
        run: dotnet test tests/Dfs.AcceptanceTests/Dfs.AcceptanceTests.csproj --no-build -c Release --verbosity normal
      - name: Collect Compose logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/env/local.example.env ps -a
          docker compose -f deploy/docker-compose.yml --env-file deploy/env/local.example.env logs --no-color --tail=200
      - name: Tear down Compose cluster
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/env/local.example.env down -v --remove-orphans
